<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Medisland</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#13121b;--panel:#1c1b23;--panel2:#2a2932;--line:#3a3842;
  --ink:#e5e0ed;--muted:#c8c4d7;--dim:#9a96aa;--gold:#ffd27a;--gold2:#f2b84b;--pink:#ff8fb1;--lav:#c6bfff;--green:#5ee0a0;--cyan:#7ee8ff;--red:#ff7a7a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:8px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.brand small{color:var(--muted);font-size:12px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:rgba(42,41,50,.75);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.chip b{color:var(--gold);font-weight:700}
.chip.loc{border-color:rgba(126,232,255,.4)}
.chip.st-plan{border-color:rgba(255,210,122,.6)}
.chip.st-run{border-color:rgba(94,224,160,.6)}
.chip .led{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.chip.st-run .led{background:var(--green);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}
.btn-ic{height:32px;min-width:32px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:rgba(42,41,50,.75);color:var(--ink);font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.btn-ic:hover{border-color:var(--gold)}
.btn-ic:disabled{opacity:.38;cursor:not-allowed}
.btn-ic.hot{border-color:var(--gold);color:var(--gold)}
.demo-tag{font-size:11px;color:#13121b;background:var(--gold);padding:2px 8px;border-radius:99px;font-weight:700}

/* ---------- demo time bar ---------- */
.demobar{display:flex;align-items:center;gap:8px;margin:0 16px 8px;padding:6px 10px;border:1px dashed rgba(255,210,122,.45);border-radius:10px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.demobar b{color:var(--gold)}
.demobar button{height:26px;padding:0 10px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:12px;cursor:pointer}
.demobar button:hover{border-color:var(--gold)}
.demobar .sp{flex:1}

/* ---------- stage ---------- */
#stage{position:relative;flex:1;min-height:0;margin:0 16px 16px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#2f78ad}
#cv{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
.hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:#fff;background:rgba(19,18,27,.65);padding:5px 10px;border-radius:8px;pointer-events:none}
#quest{position:absolute;left:12px;top:10px;max-width:min(360px,calc(100% - 24px));background:rgba(19,18,27,.86);border:1px solid rgba(255,210,122,.45);border-radius:10px;padding:8px 12px 9px;font-size:13px;line-height:1.4;z-index:2;cursor:pointer}
#quest .qh{font-family:'VT323',monospace;font-size:18px;color:var(--gold);letter-spacing:1px;line-height:1}
#quest .qt{margin-top:3px}
#quest .qsub{margin-top:3px;color:var(--dim);font-size:12px}
#quest.min .qt,#quest.min .qsub{display:none}
#mini{position:absolute;right:12px;top:10px;border:2px solid rgba(255,210,122,.6);border-radius:8px;background:#163d5c;display:none;z-index:2;image-rendering:pixelated;cursor:pointer}
#mini.on{display:block}

/* banner */
#banner{position:absolute;top:58px;left:50%;transform:translate(-50%,-8px);text-align:center;pointer-events:none;opacity:0;transition:opacity .45s,transform .45s;z-index:3;white-space:nowrap}
#banner.on{opacity:1;transform:translate(-50%,0)}
#banner b{display:block;font-family:'VT323',monospace;font-weight:400;font-size:38px;line-height:1;letter-spacing:2px;text-shadow:0 3px 0 #13121b,0 0 18px rgba(0,0,0,.6)}
#banner span{display:inline-block;margin-top:4px;font-size:13px;color:#fff;background:rgba(19,18,27,.7);padding:3px 10px;border-radius:99px}

/* ---------- dialog box ---------- */
#dlg{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(760px,calc(100% - 24px));background:rgba(19,18,27,.94);border:3px solid var(--gold);border-radius:10px;box-shadow:0 0 0 3px #13121b,0 10px 30px rgba(0,0,0,.5);padding:12px 16px 14px;display:none;z-index:5}
#dlg .who{position:absolute;top:-16px;left:14px;background:var(--gold);color:#13121b;font-family:'VT323',monospace;font-size:20px;line-height:1;padding:4px 10px;border-radius:6px}
#dlg .txt{font-family:'VT323',monospace;font-size:24px;line-height:1.2;min-height:58px;white-space:pre-line;color:#f7f0e2}
#dlg .more{position:absolute;right:14px;bottom:8px;color:var(--gold);font-family:'VT323';font-size:20px;animation:blink 1s steps(2) infinite}
#dlg .choices{display:flex;flex-direction:column;gap:4px;margin-top:8px}
#dlg .choices button{all:unset;cursor:pointer;font-family:'VT323',monospace;font-size:23px;padding:2px 8px 2px 26px;border-radius:6px;position:relative;color:#f7f0e2}
#dlg .choices button.on{background:rgba(255,210,122,.14);color:var(--gold)}
#dlg .choices button.on::before{content:'▶';position:absolute;left:8px;font-size:16px;top:5px}
@keyframes blink{50%{opacity:0}}

/* ---------- modal panels ---------- */
#modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,9,16,.62);z-index:6;padding:14px}
.panel{width:min(620px,100%);max-height:100%;overflow:auto;background:rgba(28,27,35,.98);border:1px solid rgba(255,210,122,.4);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.6);padding:18px 18px 16px;position:relative}
.panel.wide{width:min(980px,100%)}
.panel h2{margin:0 0 2px;font-size:19px;display:flex;align-items:center;gap:8px;padding-right:36px;flex-wrap:wrap}
.panel h3{margin:16px 0 8px;font-size:14px;color:var(--gold);letter-spacing:.3px}
.panel .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.panel p{font-size:14px;line-height:1.55;margin:0 0 10px}
.panel .x{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer;font-size:16px;z-index:2}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1b1408}
.btn.sm{height:30px;padding:0 11px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:14px;align-items:center}
.row .grow{flex:1}
.note{font-size:12px;color:var(--muted);margin:12px 0 0;border-top:1px dashed var(--line);padding-top:10px;line-height:1.5}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.gold{color:#1b1408;background:var(--gold);border-color:var(--gold)}
.pill.green{color:#062a19;background:var(--green);border-color:var(--green)}
.pill.red{color:#2a0606;background:var(--red);border-color:var(--red)}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:4px 0;border-bottom:1px dashed rgba(58,56,66,.8)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.news{display:flex;gap:12px;align-items:flex-start;background:rgba(126,232,255,.07);border:1px solid rgba(126,232,255,.35);border-radius:12px;padding:10px 12px;margin:0 0 12px}
.news .ic{font-size:22px;line-height:1}
.news b{display:block;font-size:14px;margin-bottom:2px}
.news span{font-size:13px;color:var(--muted);line-height:1.45}

/* brief */
.brief-head{display:flex;gap:14px;align-items:center;margin:4px 0 12px}
.logo{width:58px;height:58px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:'VT323';font-size:26px;flex-shrink:0;color:#13121b;font-weight:700}
.brief-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.brief-pick button{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel2);font-size:13px;line-height:1.35}
.brief-pick button b{display:block;font-size:14px}
.brief-pick button span{color:var(--muted);font-size:12px}
.brief-pick button.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.seglist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:12.5px;line-height:1.45;background:rgba(42,41,50,.5)}
.seg b{font-size:13.5px}
.seg .tg{float:right}
.kpi-list{display:flex;flex-direction:column;gap:6px}
.kpi-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;padding:7px 11px;border-radius:9px;background:var(--panel2);border:1px solid var(--line)}
.kpi-row b{color:var(--gold)}

/* planner */
.msgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.msgs button{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:11px;padding:9px 11px;background:var(--panel2);font-size:13px;line-height:1.35}
.msgs button b{display:block;font-size:14px}
.msgs button span{color:var(--muted);font-size:12px}
.msgs button.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;background:rgba(255,210,122,.08)}
.chs{display:flex;flex-direction:column;gap:8px}
.ch{display:grid;grid-template-columns:210px 1fr 96px;gap:6px 14px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ch .nm{display:flex;gap:9px;align-items:center}
.ch .nm .i{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.ch .nm b{font-size:14px;display:block}
.ch .nm small{color:var(--dim);font-size:11.5px;line-height:1.3;display:block}
.ch input[type=range]{width:100%;accent-color:var(--gold)}
.ch .amt{display:flex;align-items:center;gap:4px;justify-content:flex-end}
.ch .amt input{width:64px;height:32px;border-radius:8px;border:1px solid var(--line);background:#1c1b23;color:var(--ink);font:inherit;font-size:14px;text-align:right;padding:0 7px}
.ch .amt span{color:var(--dim);font-size:12px}
.ch .tac{grid-column:2 / 4;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--dim)}
.ch .tac button{all:unset;cursor:pointer;font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:#1c1b23}
.ch .tac button.on{border-color:var(--gold);color:#1b1408;background:var(--gold);font-weight:700}
.ch .est{grid-column:2 / 4;font-size:11.5px;color:var(--dim)}
.ch.off{opacity:.92}
.alloc{height:14px;border-radius:99px;background:#1c1b23;border:1px solid var(--line);display:flex;overflow:hidden;margin:6px 0}
.alloc i{display:block;height:100%}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.sum{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px}
.sum b{color:var(--gold)}
.warn{color:var(--red);font-weight:700}
.lockbox{background:rgba(94,224,160,.08);border:1px solid rgba(94,224,160,.4);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px;line-height:1.5}

/* reports */
.tabs{display:flex;gap:6px;margin:10px 0 12px;flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:6px 13px;border-radius:99px;border:1px solid var(--line);font-size:13px;color:var(--muted)}
.tabs button.on{background:var(--gold);color:#1b1408;border-color:var(--gold);font-weight:700}
.wsel{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.wsel button{all:unset;cursor:pointer;width:30px;height:28px;text-align:center;border-radius:8px;border:1px solid var(--line);font-size:13px}
.wsel button.on{border-color:var(--cyan);color:var(--cyan);font-weight:700}
.wsel button:disabled{opacity:.3;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi small{display:block;color:var(--dim);font-size:11.5px;line-height:1.3;min-height:30px}
.kpi b{display:block;font-size:21px;margin:3px 0 1px}
.kpi .t{font-size:11.5px;color:var(--muted)}
.kpi .bar{height:6px;border-radius:9px;background:#1c1b23;margin-top:6px;overflow:hidden}
.kpi .bar i{display:block;height:100%;border-radius:9px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.stat small{color:var(--dim);font-size:11.5px}
.stat b{display:block;font-size:17px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px}
.tblw{overflow:auto;border:1px solid var(--line);border-radius:12px}
.tbl th,.tbl td{padding:8px 9px;text-align:right;border-bottom:1px solid rgba(58,56,66,.7);white-space:nowrap}
.tbl th{color:var(--dim);font-weight:600;font-size:11.5px;background:#232229;position:sticky;top:0}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.tbl tr:last-child td{border-bottom:0}
.tbl tfoot td{font-weight:700;background:#232229}
.up{color:var(--green)}.dn{color:var(--red)}
.chart{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.chart h4{margin:0 0 6px;font-size:13px}
.chart svg{display:block;width:100%;height:auto}
.qs{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:rgba(198,191,255,.07);border:1px solid rgba(198,191,255,.3);font-size:13px;line-height:1.55}
.qs b{color:var(--lav)}
.qs ul{margin:4px 0 0;padding-left:18px}
.live{display:flex;gap:10px;align-items:center;background:rgba(94,224,160,.08);border:1px solid rgba(94,224,160,.35);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.live .pbar{flex:1;height:8px;border-radius:9px;background:#1c1b23;overflow:hidden;min-width:80px}
.live .pbar i{display:block;height:100%;background:var(--green)}

/* notebook */
.nb-f{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.nb-f button{all:unset;cursor:pointer;padding:4px 11px;border-radius:99px;border:1px solid var(--line);font-size:12px;color:var(--muted)}
.nb-f button.on{border-color:var(--gold);color:var(--gold)}
.nb{display:flex;flex-direction:column;gap:7px}
.nbi{border-left:3px solid var(--gold);background:var(--panel2);border-radius:0 10px 10px 0;padding:8px 11px;font-size:13px;line-height:1.5}
.nbi .m{font-size:11.5px;color:var(--dim);margin-bottom:2px}
.nbi .tag{font-size:10.5px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);margin-left:5px;color:var(--muted)}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:22px 0}

/* final */
.grade{display:flex;gap:16px;align-items:center;margin:8px 0 14px}
.grade .big{width:92px;height:92px;border-radius:20px;background:var(--gold);color:#1b1408;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'VT323';font-size:44px;line-height:.9;flex-shrink:0}
.grade .big small{font-family:'Be Vietnam Pro';font-size:11px;font-weight:700}

/* toast */
#toast{position:absolute;top:12px;left:50%;transform:translateX(-50%) translateY(-90px);background:rgba(19,18,27,.95);border:1px solid var(--gold);color:var(--ink);padding:8px 14px;border-radius:10px;font-size:13.5px;transition:transform .25s;z-index:7;max-width:calc(100% - 24px);text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}

/* touch pad */
#pad{position:absolute;inset:auto 0 0 0;height:0;display:none;z-index:4}
.dpad{position:absolute;left:12px;bottom:12px;width:132px;height:132px;opacity:.85}
.dpad button,.ab button{position:absolute;width:44px;height:44px;border-radius:10px;border:2px solid rgba(255,255,255,.25);background:rgba(19,18,27,.6);color:#fff;font-size:18px;touch-action:none;user-select:none;-webkit-user-select:none}
.dpad [data-d=up]{left:44px;top:0}.dpad [data-d=down]{left:44px;bottom:0}.dpad [data-d=left]{left:0;top:44px}.dpad [data-d=right]{right:0;top:44px}
.ab{position:absolute;right:14px;bottom:18px;width:120px;height:100px}
.ab button{border-radius:50%;width:54px;height:54px;font-family:'VT323';font-size:24px}
.ab .a{right:0;top:0;background:rgba(255,210,122,.85);color:#13121b;border-color:#ffe7b0}
.ab .b{left:0;bottom:0}
body.touch #pad{display:block}
body.touch .hint{display:none}
body.touch #dlg{bottom:160px}

@media (max-width:1500px){.brand small{display:none}.top{gap:6px}.btn-ic{padding:0 9px}}
@media (max-width:860px){
  .top{padding:8px 10px;gap:6px}
  .brand small{display:none}
  #stage{margin:0 8px 8px}
  .demobar{margin:0 8px 6px}
  .chip{height:28px;padding:0 9px;font-size:12px}
  .brand .demo-tag{display:none}
  .brand h1{font-size:15px}
  .btn-ic{height:28px;font-size:12px;padding:0 8px}
  #dlg .txt{font-size:21px}
  #banner b{font-size:30px}
  .ch{grid-template-columns:1fr 92px}
  .ch .nm{grid-column:1 / 3}
  .ch .tac,.ch .est{grid-column:1 / 3}
  .msgs,.brief-pick,.grid3{grid-template-columns:1fr}
  .seglist,.grid2{grid-template-columns:1fr}
  #quest{font-size:12px}
  .demobar span:nth-child(3){display:none}
  #bSound{display:none}
  .demobar{font-size:11.5px;gap:6px}
}

/* hướng thiết kế */
.styles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.styles button{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:11px;padding:8px;background:var(--panel2);font-size:12.5px;line-height:1.35;display:flex;flex-direction:column;gap:3px}
.styles button img{width:100%;aspect-ratio:46/22;image-rendering:pixelated;border-radius:6px;display:block;margin-bottom:3px}
.styles button b{font-size:13.5px}
.styles button span{color:var(--muted);font-size:11.5px}
.styles button.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;background:rgba(255,210,122,.08)}
.styles button:disabled{cursor:default;opacity:.85}
.react{display:flex;gap:12px;align-items:center;border-radius:12px;padding:10px 12px;margin:0 0 12px;border:1px solid var(--line);background:var(--panel2);font-size:14px;line-height:1.45}
.react .face{font-size:30px}
.react.lv3{border-color:var(--green)}.react.lv0{border-color:var(--red)}
/* biểu quyết */
.votes{display:flex;gap:6px;flex-wrap:wrap}
.vote{font-size:12.5px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.vote.yes{border-color:var(--green);color:var(--green);font-weight:700}
.checks{margin-top:10px;display:grid;gap:3px;font-size:13px;color:var(--red)}
.checks .ok{color:var(--green)}
/* bảng ý tưởng */

function setT(x, y, c) { if (inMap(x, y)) MAP.tile[y][x] = c; }
function rect(x0, y0, x1, y1, c, onlyLand = true) { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { if (!inMap(x, y)) continue; if (onlyLand && (MAP.tile[y][x] === WATER)) continue; MAP.tile[y][x] = c; } }

    [17, 18], [17, 21], [17, 24], [32, 18], [34, 19], [32, 21], [35, 22], [27, 25], [24, 25],
    [62, 6], [65, 9], [53, 18], [57, 18], [66, 13], [67, 17], [53, 11],
    [6, 30], [6, 37], [15, 37], [17, 39], [9, 38], [35, 34], [35, 36], [34, 38],
    [6, 44], [7, 47], [11, 48], [35, 44], [35, 47],
    [53, 34], [53, 37], [66, 38], [68, 32], [53, 47], [66, 44], [64, 48]];
  trees.forEach(([x, y]) => { if (MAP.tile[y] && (MAP.tile[y][x] === G || MAP.tile[y][x] === FL)) MAP.tile[y][x] = TR; });
  for (let x = 23; x <= 31; x++) if (x !== 27) setT(x, 13, MAP.tile[13][x] === STONE ? STONE : HEDGE);
  for (let x = 8; x <= 16; x += 2) setT(x, 13, MAP.tile[13][x] === STONE ? STONE : HEDGE);
  for (let x = 44; x <= 50; x += 2) setT(x, 42, MAP.tile[42][x] === STONE ? STONE : FL);

  // đánh dấu công trình
  for (const b of BLD) {
    for (let y = b.y; y < b.y + b.h; y++) for (let x = b.x; x < b.x + b.w; x++) {
      if (!inMap(x, y)) continue;
      if (b.kind !== 'ferry' && MAP.tile[y][x] === WATER) console.warn('bld on water', b.id, x, y);

  // làn xe

  MAP.lanes = [laneH(14, -1), laneH(15, 1), laneH(40, -1), laneH(41, 1), laneV(19, 1), laneV(20, -1), laneV(55, 1), laneV(56, -1)];

/* nền dưới công trình */
function groundUnder(b) { return b.dist ? G : PLAZA; }
function drawBld(g, b) {
  const px = b.x * T, py = b.y * T, w = b.w * T, h = b.h * T;
  if (b.kind === 'ferry') { for (let y = b.y; y < b.y + b.h; y++) for (let x = b.x; x < b.x + b.w; x++) drawWater(g, x * T, y * T, x, y); }
  else for (let y = b.y; y < b.y + b.h; y++) for (let x = b.x; x < b.x + b.w; x++) {
    const inPlaza = x >= PLAZA_R[0] && x <= PLAZA_R[2] && y >= PLAZA_R[1] && y <= PLAZA_R[3];
    if (inPlaza) drawPlaza(g, x * T, y * T, x, y); else drawGrass(g, x * T, y * T, x, y);
  }
  const f = { tower: bTower, agency: bAgency, datalab: bDataLab, tv: bTV, tvtower: bTVTower, univ: bUniv, library: bLibrary, dorm: bDorm, house: bHouse, mart: bMart, mall: bMall, stall: bStall, shop: bShop, kiosk: bKiosk, fountain: bFountain, bench: bBench, ferry: bFerry }[b.kind];
  if (b.kind === 'brandhq') bBrandHQ(g, px, py, w, h, BRIEFS[st.brief] || BRIEFS.maytea);
  else if (f) f(g, px, py, w, h, b);
  else if (b.kind === 'billboard') { R(g, 'rgba(0,0,0,.2)', px + 4, py + h - 3, w - 6, 3); R(g, '#4a4458', px + 10, py + 14, 3, h - 14); R(g, '#4a4458', px + w - 13, py + 14, 3, h - 14); }
}
function drawLamp(g, px, py, part) {
  if (part !== 'top') { R(g, 'rgba(0,0,0,.2)', px + 4, py + 13, 8, 2); R(g, '#3b3350', px + 6, py + 11, 4, 4); R(g, '#3b3350', px + 7, py, 2, 12); }
  if (part !== 'base') { R(g, '#3b3350', px + 7, py - 6, 2, 6); R(g, '#3b3350', px + 4, py - 12, 8, 2); R(g, '#ffe39a', px + 5, py - 10, 6, 5); R(g, '#c99a3a', px + 4, py - 5, 8, 1); R(g, '#3b3350', px + 7, py - 14, 2, 2); }
}
let STAT = null, OVER = null, MINI = null;
function buildStatic() {
  STAT = mk(W * T, H * T); OVER = mk(W * T, H * T);
  const g = STAT.getContext('2d'), og = OVER.getContext('2d');
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const c = MAP.tile[y][x], px = x * T, py = y * T;
    if (c === G) drawGrass(g, px, py, x, y);
    else if (c === FL) drawFlower(g, px, py, x, y);
    else if (c === SAND) drawSand(g, px, py, x, y);
    else if (c === STONE) drawStone(g, px, py, x, y);
    else if (c === PLAZA) drawPlaza(g, px, py, x, y);
    else if (c === WATER) drawWater(g, px, py, x, y);
    else if (c === PLANK) drawPlank(g, px, py, x, y);
    else if (c === ROAD) drawRoad(g, px, py, x, y);
    else if (c === TR) drawTree(g, px, py, x, y, islandD(x, y) >= .8 ? drawSand : drawGrass);
    else if (c === PALM) drawPalm(g, px, py, x, y);
    else if (c === HEDGE) drawHedge(g, px, py, x, y);
    else if (c === SOLID && MAP.obj[y][x] === 'lamp') { const n = (xx, yy) => tileAt(xx, yy); const nb = [n(x, y + 1), n(x, y - 1), n(x - 1, y)]; (nb.includes(PLAZA) ? drawPlaza : nb.includes(STONE) ? drawStone : drawGrass)(g, px, py, x, y); drawLamp(g, px, py, 'base'); drawLamp(og, px, py, 'top'); MAP.glows.push([px + 8, py - 8, 26]); }
  }
  for (const b of BLD) drawBld(g, b);
  // nhãn khu vực / công trình
  MAP.labels = [];
  const lb = (t, b, col) => MAP.labels.push({ t, x: (b.x + b.w / 2) * T, y: b.y * T - 7, col });
  lb('Agency Hub · Văn phòng các nhóm', MAP.blds.agency, 'gold');
  lb('Tháp Thương Hiệu · Brief', MAP.blds.brandhq, 'pink');
  lb('Đài Dữ Liệu · Báo cáo', MAP.blds.datalab, 'cyan');
  lb('Bến phà · về Knoworld City', { x: 34, y: 51, w: 8 }, 'gold');
  // cửa sổ sáng ban đêm
  for (const b of BLD) if (['tower', 'dorm', 'house', 'mall', 'univ'].includes(b.kind)) MAP.glows.push([(b.x + b.w / 2) * T, (b.y + b.h - 1) * T, b.kind === 'house' ? 18 : 30]);

function estLine(c, p) {

  if (c === 'social') { const cpm = CHANNELS.social.cpm * (p.target === 'all' ? 1 : 1.25); return `≈ ${big(v * 1e6 / cpm)} lượt hiển thị · CPM ${nf(cpm)}k${p.target !== 'all' ? ' (nhắm chọn đắt hơn 25%)' : ''}`; }
  if (c === 'kol') { const o = CHANNELS.kol.tactic.opts[p.kolType]; return `≈ ${big(v * 1e6 / o.cpm)} lượt xem · CPM ${o.cpm}k`; }

  if (c === 'act') return `≈ ${big(v * 1000 / CHANNELS.act.cpc)} lượt trải nghiệm · ${CHANNELS.act.cpc}k/người — 1 điểm chỉ phục vụ được số người có hạn`;

  return '';
}

/* =====================================================================

   ===================================================================== */
const OW_ = 24, OH_ = 17;
const OF = 20, OWL = 21, OGL = 22, OCP = 23, OX = 24, OSD = 25;
const OFF = { W: OW_, H: OH_, tile: [], obj: [], stat: null, npcs: [], labels: [], desks: [] };
let INOFF = false, fade = 0, cityPos = null;
const offSolid = (x, y) => x < 0 || y < 0 || x >= OW_ || y >= OH_ || [OWL, OGL, OSD].includes(OFF.tile[y][x]);

function buildOffice() {
  OFF.tile = []; OFF.obj = [];
  for (let y = 0; y < OH_; y++) { OFF.tile.push(Array(OW_).fill(OF)); OFF.obj.push(Array(OW_).fill(null)); }
  const set = (x, y, t, o = null) => { OFF.tile[y][x] = t; if (o) OFF.obj[y][x] = o; };
  for (let x = 0; x < OW_; x++) { for (let y = 0; y <= 2; y++) set(x, y, OWL); set(x, OH_ - 1, OWL); }
  for (let y = 0; y < OH_; y++) { set(0, y, OWL); set(OW_ - 1, y, OWL); }
  set(11, OH_ - 1, OX); set(12, OH_ - 1, OX);
  // phòng họp kính
  for (let y = 3; y <= 7; y++) for (let x = 8; x <= 15; x++) set(x, y, OCP);
  for (let x = 7; x <= 16; x++) if (x !== 11 && x !== 12) set(x, 8, OGL);
  for (let y = 3; y <= 8; y++) { set(7, y, OGL); set(16, y, OGL); }
  const block = (x0, y0, w, h, id) => { for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) set(x, y, OSD, id); };
  block(9, 4, 6, 3, 'table');
  for (let x = 10; x <= 13; x++) OFF.obj[2][x] = 'screen';
  OFF.obj[2][14] = 'board'; OFF.obj[2][15] = 'board'; OFF.obj[2][8] = 'board'; OFF.obj[2][9] = 'board';
  // bàn điều phối (console)
  block(2, 4, 4, 2, 'console');
  // tủ hồ sơ + máy in
  block(1, 9, 2, 2, 'cabinet');
  // bàn làm việc (2 ô) — ghế ở ô bên dưới
  OFF.desks = [[18, 4], [20, 4], [18, 7], [20, 7], [3, 11], [5, 11], [7, 11], [14, 11], [16, 11], [18, 11]];
  OFF.desks.forEach(([x, y], i) => block(x, y, 2, 1, 'desk' + i));
  block(21, 13, 1, 1, 'cooler');
  [[1, 3], [22, 3], [1, 14], [22, 14], [6, 14], [17, 14]].forEach(([x, y]) => block(x, y, 1, 1, 'plant'));
  block(9, 14, 1, 1, 'plant');
}

async function classBoard(classId) {
  let rows = [];
  try { rows = await API().board(classId); } catch (e) { rows = []; }
  return rows.map((r) => {
    const g = { id: r.id, name: r.name, color: r.color }, b = BRIEFS[r.brief] || BRIEFS.maytea;
    const sc = r.id === st.gid ? st.results.map((_, i) => scoreUpTo(B(), st.results, i + 1)) : (r.scores || []);
    const k = sc.length;
    return { g, b, k, weekly: [1, 2, 3, 4].map((w) => (w <= k ? sc[w - 1] : null)), score: k ? sc[k - 1] : 0 };
  });
}
function agencyOfWeek(rows, w) { const c = rows.filter((r) => r.weekly[w - 1] !== null).sort((a, b) => b.weekly[w - 1] - a.weekly[w - 1]); return c[0] || null; }
