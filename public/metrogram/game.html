<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MetroGram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0f16;--panel:rgba(22,27,38,.92);--panel2:#1d2331;--line:#2a3142;
  --ink:#eef0f6;--muted:#c3c8d6;--dim:#8a91a5;--gold:#ffd27a;--pink:#ff8fb1;--lav:#c6bfff;--green:#5ee0a0;--cyan:#7ee8ff;--red:#ff7a7a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(1200px 600px at 20% -10%,#1b2236 0%,#0c0f16 60%);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit}
.top{display:flex;align-items:center;gap:8px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand .dot{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#ff6fa3,#b388ff 55%,#6fd6ff);box-shadow:0 0 16px rgba(179,136,255,.5)}
.brand h1{margin:0;font-size:17px;font-weight:700;white-space:nowrap}
.brand small{color:var(--muted);font-size:12px}
.demo-tag{font-size:11px;color:#13121b;background:var(--gold);padding:2px 8px;border-radius:99px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:rgba(42,41,50,.75);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.chip b{color:var(--gold)}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg2 button{height:32px;padding:0 12px;border:0;background:rgba(42,41,50,.75);color:var(--muted);font-size:13px;cursor:pointer}
.seg2 button.on{background:#fff;color:#0c0f16;font-weight:700}
.demobar{display:flex;align-items:center;gap:8px;margin:0 16px 8px;padding:6px 10px;border:1px dashed rgba(255,210,122,.45);border-radius:10px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.demobar b{color:var(--gold)}
.demobar .sp{flex:1}
.demobar button{height:26px;padding:0 10px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:12px;cursor:pointer}
.demobar button:hover{border-color:var(--gold)}
.wrap{flex:1;min-height:0;display:flex;gap:12px;padding:0 16px 16px}
#stage{position:relative;flex:1;min-width:0;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#121621;box-shadow:0 20px 50px rgba(0,0,0,.35)}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}
#hud{position:absolute;right:10px;top:10px;background:rgba(12,15,22,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:8px 12px;font-size:12px;min-width:190px;pointer-events:none}
#hud .clock{font-size:17px;font-weight:800;color:#fff;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
#hud .row{display:flex;justify-content:space-between;gap:12px;margin-top:3px}
#hud .row b{font-variant-numeric:tabular-nums}
#hud .prog{height:4px;background:var(--panel2);border-radius:4px;margin-top:6px;overflow:hidden}
#hud .prog i{display:block;height:100%;background:linear-gradient(90deg,#ff8fb1,#b388ff,#7ee8ff)}
#legend{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);background:rgba(12,15,22,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:6px 10px;font-size:11px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
#legend .d{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
#legend button{height:22px;padding:0 8px;border-radius:6px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-size:11px;cursor:pointer}
#legend button.on{background:var(--gold);color:#13121b}
#prompt{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--pink);color:#13121b;font-weight:700;font-size:12.5px;padding:6px 12px;border-radius:99px;display:none;cursor:pointer;white-space:nowrap}
#toast{position:absolute;left:50%;bottom:54px;transform:translateX(-50%);background:var(--green);color:#13121b;font-weight:700;font-size:13px;padding:8px 14px;border-radius:10px;display:none;max-width:90%;text-align:center}
.panel{width:410px;flex:none;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:18px;min-height:0;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{height:30px;padding:0 11px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted);font-size:13px;cursor:pointer}
.tab:hover{border-color:var(--line)}
.tab.on{background:linear-gradient(135deg,#ff8fb1,#b388ff);color:#fff;font-weight:700}
.tb{flex:1;overflow:auto;padding:14px 14px 18px;font-size:13.5px;line-height:1.5}
.tb h3{margin:0 0 8px;font-size:15px}
.tb h4{margin:14px 0 6px;font-size:13px;color:var(--lav);text-transform:uppercase;letter-spacing:.4px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.muted{color:var(--dim);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;border:1px solid var(--line);margin:2px 4px 2px 0;background:var(--panel)}
.pill .d{width:8px;height:8px;border-radius:2px}
.pill.bad{border-color:rgba(255,122,122,.6);color:var(--red)}
.pill.ok{border-color:rgba(94,224,160,.6);color:var(--green)}
.pill.strike{text-decoration:line-through;opacity:.6}
.pill.click{cursor:pointer}
.pill.click:hover{border-color:var(--gold)}
.pill.flag{border-color:var(--red);color:var(--red);text-decoration:line-through}
textarea{width:100%;min-height:78px;resize:vertical;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:14px}
textarea:focus{outline:none;border-color:var(--pink)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{height:30px;padding:0 11px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:12.5px;cursor:pointer}
.pick button.on{background:linear-gradient(135deg,#ff8fb1,#b388ff);border-color:transparent;color:#fff;font-weight:700}
.pick button:disabled{opacity:.35;cursor:not-allowed}
.lbl{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 6px;font-weight:600;font-size:13px}
.lbl span{font-weight:400;color:var(--dim);font-size:12px}
.warn{color:var(--gold);font-size:12.5px;margin-top:6px}
.btn{height:42px;width:100%;margin-top:14px;border-radius:12px;border:0;background:linear-gradient(135deg,#ff7aa8,#b388ff);color:#fff;font-weight:700;font-size:14px;cursor:pointer}
.btn:disabled{background:var(--panel2);color:var(--dim);cursor:not-allowed}
.btn.sure{background:var(--gold)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 8px}
.stat .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .k{font-size:11px;color:var(--dim);line-height:1.25}
.stat.main{border-color:rgba(255,143,177,.6)}
.stat.main .v{color:var(--pink)}
.stat.top .v{color:var(--gold)}
.bars .r{display:grid;grid-template-columns:104px 1fr 78px;gap:8px;align-items:center;font-size:12px;margin:4px 0}
.bars .t{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}
.bars .t i{display:block;height:100%;border-radius:5px}
.bars .n{white-space:nowrap;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.days{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.days button{width:38px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:12px;cursor:pointer}
.days button.on{background:var(--cyan);color:#13121b;border-color:var(--cyan);font-weight:700}
.days button:disabled{opacity:.3;cursor:not-allowed}
ul.notes{margin:4px 0 0;padding-left:18px}
.gvb{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px;font-size:12px}
.gvb span{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px 8px}
.gvb .tot{border-color:rgba(255,210,122,.6);color:var(--gold)}
.stars{display:flex;align-items:center;gap:3px;margin-top:6px;flex-wrap:wrap}
.stars button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--dim);font-size:15px;cursor:pointer}
.stars button.on{color:var(--gold);border-color:rgba(255,210,122,.6)}
.stars button.clr{width:auto;padding:0 8px;font-size:11.5px}
.post{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.post .ph{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.post .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,#ff8fb1,#b388ff)}
.post .acts{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.post .acts button{height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:12.5px;cursor:pointer}
.post .acts button.on{border-color:rgba(255,143,177,.7);color:var(--pink)}
.post .acts button:disabled{opacity:.7;cursor:default}
ul.notes li{margin:3px 0}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--dim);font-weight:600;font-size:11.5px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.me td{background:rgba(255,143,177,.08)}
.hook{font-size:14px;line-height:1.45;margin:2px 0 6px}
.chart{width:100%;height:130px;display:block}
@media (max-width:900px){
  html,body{height:auto}
  body{overflow:auto}
  .wrap{flex-direction:column;padding:0 10px 12px}
  #stage{flex:none;height:auto;display:flex;flex-direction:column}
  #cv{height:62vw;min-height:230px;max-height:60vh;flex:none}
  #legend{position:static;max-width:none;border-radius:0;background:var(--panel)}
  #toast{bottom:auto;top:40%}
  .panel{width:auto}
  .tb{overflow:visible}
  .top{padding:10px}
  .demobar{margin:0 10px 8px}
  #hud{min-width:0;padding:4px 8px;font-size:10px;top:6px;right:6px;border-radius:10px}
  #hud .clock{font-size:12px}
  #legend{font-size:10px;padding:4px 7px}
}

input,select{width:100%;height:38px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:0 10px;font:inherit;font-size:13.5px}
input:focus,select:focus{outline:none;border-color:var(--pink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cks{display:flex;flex-wrap:wrap;gap:4px 12px}
.ck{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;cursor:pointer}
.ck input{width:auto;height:auto}
.row-btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.row-btns select{flex:1;min-width:140px}
.btn.sm{height:32px;width:auto;margin-top:0;padding:0 12px;font-size:12.5px;border-radius:9px}
.sw{display:inline-block;width:9px;height:9px;border-radius:3px}
.stars button.feat{color:var(--gold);border-color:rgba(255,210,122,.6)}
.top .out{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:rgba(42,41,50,.75);color:var(--muted);font-size:12.5px;cursor:pointer}
.top .out:hover{border-color:var(--pink);color:var(--ink)}
.chip.admin{border-color:rgba(255,210,122,.6);color:var(--gold)}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="dot"></span><div><h1>MetroGram</h1><small>B1 · Metro Concourse — Ga Main City Central · Social Media Marketing</small></div></div>
  <span class="chip" id="dayWrap"></span>
  <span class="chip" id="groupChip"></span>
  <span class="chip admin" id="roleChip" style="display:none">🎓 Giảng viên</span>
  <button class="out" id="outBtn" style="display:none">Rời nhóm</button>
</header>
<div class="wrap">
  <section id="stage">
    <canvas id="cv"></canvas>
    <div id="hud"></div>
    <div id="prompt">📱 Chạm hoặc nhấn E để mở MetroGram</div>
    <div id="toast"></div>
    <div id="legend"></div>
  </section>
  <aside class="panel">
    <div class="tabs" id="tabs"></div>
    <div class="tb" id="tb"></div>
  </aside>
</div>
<script>
(()=>{
// ===================================================================== MetroGram (v52)
// Dữ liệu thật qua parent.__kwGram (lib/metrogram.js). Kết quả khách đi tàu do máy chủ tính.
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SEGS=[
 {id:'genz',name:'Gen Z sinh viên',color:'#ff8fb1',mix:.26},
 {id:'office',name:'Dân văn phòng',color:'#7ee8ff',mix:.22},
 {id:'mom',name:'Mẹ bỉm sữa',color:'#ffd27a',mix:.14},
 {id:'mid',name:'Người trung niên',color:'#c8a2ff',mix:.14},
 {id:'tech',name:'Dân công nghệ',color:'#5ee0a0',mix:.12},
 {id:'fit',name:'Gymer / sống khỏe',color:'#ff9a5c',mix:.12}];
const SEG=Object.fromEntries(SEGS.map(s=>[s.id,s]));
const CTA_RE=/(ngay|thử|mua|đặt|đăng ký|inbox|ghé|click|săn|nhận|tải|order|comment|bình luận|tag|chia sẻ|share|follow|xem thêm)/i;
const EMOJI_RE=/\p{Extended_Pictographic}/u;
const SLANG_RE=/(xỉu|đỉnh|chill|flex|slay|keo|mlem|real|vibe|crush|khum|hem|ủa|dữ vậy|u là trời|pov|ét o ét|hết nước chấm|xịn|cháy|gét gô|over hợp|quá trời)/i;
const TONES=[{id:'humor',label:'Hài hước'},{id:'emotion',label:'Cảm xúc'},{id:'luxury',label:'Sang trọng'},{id:'direct',label:'Thẳng thắn'}];
const TECHS=[
 {id:'question',label:'Đặt câu hỏi',check:t=>/[?？]/.test(t),why:'hook không có dấu “?”'},
 {id:'number',label:'Con số',check:t=>/\d/.test(t),why:'hook không có con số'},
 {id:'curiosity',label:'Gây tò mò'},{id:'pain',label:'Chạm nỗi đau'},{id:'fomo',label:'Khan hiếm / FOMO'},{id:'story',label:'Kể chuyện'}];
const EXTRAS=[
 {id:'cta',label:'Có CTA',check:t=>CTA_RE.test(t),why:'không thấy lời kêu gọi hành động (ngay, thử, đặt, ghé…)'},
 {id:'emoji',label:'Có emoji',check:t=>EMOJI_RE.test(t),why:'hook không có emoji'},
 {id:'slang',label:'Ngôn ngữ Gen Z',check:t=>SLANG_RE.test(t),why:'không thấy từ ngữ Gen Z'}];
const TIMES=[{id:'morning',label:'07:00 Sáng',h:7},{id:'noon',label:'12:00 Trưa',h:12},{id:'evening',label:'20:00 Tối',h:20},{id:'late',label:'23:00 Khuya',h:23}];
const TAG={};[...TONES,...TECHS,...EXTRAS].forEach(t=>TAG[t.id]=t);
const TIME=Object.fromEntries(TIMES.map(t=>[t.id,t]));
const ERR={offline:'Mất kết nối máy chủ, thử lại sau nhé.',notfound:'Không tìm thấy nhóm: kiểm tra MSSV và mã nhóm.',code:'Mã nhóm không đúng.',mssv:'MSSV không có trong nhóm.',nogroup:'Nhóm không còn tồn tại.',
 notopen:'MetroGram chưa mở (hoặc đã hết tuần) cho lớp của bạn.',posted:'Nhóm đã đăng hook hôm nay rồi.',length:'Hook phải dài 10–150 ký tự.',tone:'Chọn 1 giọng điệu.',tech:'Chọn 1–2 kỹ thuật hook.',slot:'Chọn giờ đăng.',
 slotpast:'Giờ đăng này đã qua, chọn khung giờ sau nhé.',own:'Không tự tương tác với hook của nhóm mình nha.',closed:'Hook này đã hết ngày, không tương tác được nữa.',noactor:'Không xác định được người tương tác.',op:'Thao tác không hợp lệ.'};
const errText=r=>ERR[r&&r.err]||((r&&r.message)||'Có lỗi xảy ra.');
const LKEY='kw_mg_login';
const lsGet=()=>{try{return JSON.parse(localStorage.getItem(LKEY)||'null')}catch(e){return null}};
const lsSet=v=>{try{v?localStorage.setItem(LKEY,JSON.stringify(v)):localStorage.removeItem(LKEY)}catch(e){}};

let API=null,run=null;
const S={admin:false,visitor:{role:'stranger',mssv:''},login:null,me:null,feed:null,live:[],boardClass:null,board:null,featured:[],
  ad:{classes:[],cls:null,posts:[],day:1,edit:null,msg:''},loading:true};
let tab='feed',resDay=1,draft={text:'',tone:null,tech:[],extra:[],time:null},sure=false,busy=false,highlightTA=false,joinMsg='';

function vnNow(){const off=S.me?S.me._skew:0;return new Date(Date.now()+(off||0))}
function vnParts(){const f=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Ho_Chi_Minh',hour:'2-digit',minute:'2-digit',hour12:false}).format(vnNow());const [h,m]=f.split(':').map(Number);return{h:h%24,m}}
const isMember=()=>!!(S.me&&S.me.ok);
const todayPost=()=>isMember()?(S.me.posts||[]).find(p=>p.day===S.me.today)||null:null;
const myTA=()=>isMember()?((S.me.group.brand||{}).ta||[]):[];
const reactMssv=()=>isMember()?S.login.mssv:(S.visitor.role==='student'?S.visitor.mssv:'');

// ---------------------------------------------------------------- dữ liệu
async function waitApi(){for(let i=0;i<60;i++){try{if(parent&&parent.__kwGram)return parent.__kwGram}catch(e){} await new Promise(r=>setTimeout(r,100))}return null}
async function loadMe(){
  if(!S.login){S.me=null;return}
  const r=await API.me(S.login.group,S.login.mssv,S.login.code);
  if(r&&r.ok){r._skew=r.now-Date.now();S.me=r}
  else if(r&&r.err&&r.err!=='offline'){S.me=null;S.login=null;lsSet(null)}
}
async function loadFeed(){S.feed=await API.feed(reactMssv(),isMember()?S.login.code:'')}
async function loadBoard(){
  let cid=isMember()?S.me.group.class_id:S.boardClass;
  if(!isMember()){S.live=await API.live();if(!cid||!S.live.some(c=>c.id===cid))cid=S.live[0]&&S.live[0].id}
  S.boardClass=cid;S.board=cid?await API.board(cid):null;
}
async function loadFeatured(){S.featured=await API.featured()}
async function refresh(all){
  try{await loadMe();await loadFeed();if(all||tab==='rank')await loadBoard();if(all)await loadFeatured();if(S.admin&&tab==='gv'&&all)await adLoad()}catch(e){console.warn(e)}
  const ae=document.activeElement,typing=ae&&['TEXTAREA','INPUT','SELECT'].includes(ae.tagName);
  if(all||!(typing||tab==='join'||tab==='gv'||(tab==='post'&&draft.text)))render();else{header();legend()}
}

// ---------------------------------------------------------------- header & tabs
function header(){
  const g=isMember()?S.me.group:null;
  $('dayWrap').innerHTML=isMember()?(S.me.today<1?'Chưa mở':S.me.today>S.me.days?'<b>Đã hết tuần</b>':`Ngày <b>${S.me.today}</b>/${S.me.days}`):'Bảng tin hôm nay';
  $('groupChip').innerHTML=g?`<i class="sw" style="background:${esc(g.color)}"></i>${esc(g.name)} · ${esc((g.brand||{}).brand||'')}`:(S.visitor.role==='student'?`👤 ${esc(S.visitor.mssv)} · thành viên`:'👤 Khách');
  $('outBtn').style.display=g?'':'none';
  $('roleChip').style.display=S.admin?'':'none';
}
function tabsList(){
  let t=isMember()?[['brief','📋 Brief'],['post','✍️ Đăng hook'],['feed','📱 Bảng tin'],['res','📊 Kết quả'],['rank','🏆 Xếp hạng']]
                 :[['feed','📱 Bảng tin'],['rank','🏆 Xếp hạng'],['join','🔑 Vào nhóm']];
  if(S.admin)t.push(['gv','🎓 Giảng viên']);

function statBox(v,k,cls=''){return `<div class="stat ${cls}"><div class="v">${v}</div><div class="k">${k}</div></div>`}
function notesFor(p){
  const s=p.sim||{},b=S.me.group.brand||{},n=[];
  (s.dropped||[]).forEach(d=>n.push(`Nhãn “${(TAG[d.id]||{label:d.id}).label}” bị bỏ: ${d.gv?'giảng viên đánh dấu nhãn này không đúng với hook':d.why}.`));
  (s.issues||[]).forEach(i=>n.push(i.k==='banned'?`Dùng từ cấm trong guideline: “${i.w}”.`:`Giọng “${(TAG[i.tone]||{label:i.tone}).label}” lệch guideline (thương hiệu dùng: ${(b.tones||[]).map(t=>TAG[t]?TAG[t].label:t).join(', ')}).`));
  if(s.fatigue)n.push('Khán giả thấy hook na ná hôm qua (cùng giọng, cùng kỹ thuật) nên hơi nhàm.');
  const per=s.per||[];
  if(per.length&&per.some(x=>x.like>0)){
    const by=[...per].sort((x,y)=>y.like/y.n-x.like/x.n),top=by[0];
    n.push(`Phản ứng mạnh nhất: ${SEG[top.id].name}${top.ta?' (đúng tệp ✓)':' (ngoài tệp)'}.`);
    const r=Math.min(...per.filter(x=>x.ta).map(x=>by.indexOf(x)));
    if(isFinite(r)&&r>=3)n.push('Tệp mục tiêu phần lớn lướt qua. Thử quan sát xem họ hay dừng lại với kiểu hook nào.');
  }
  const pct=pctOf(s);if(pct>=60)n.push('Phần lớn tương tác đến từ đúng khách hàng mục tiêu 👏');
  if(s.mention===false)n.push('Hook không nhắc tên thương hiệu.');
  return n;
}
function pctOf(s){const t=(s.likeTA||0)+(s.likeOff||0)+(s.shareTA||0)+(s.shareOff||0);return t?Math.round(100*((s.likeTA||0)+(s.shareTA||0))/t):0}
function resultBlock(d){
  const me=S.me,p=(me.posts||[]).find(x=>x.day===d);
  if(!p)return `<div class="card muted">${d<me.today||d>me.days?`Ngày ${d}: không đăng, 0 điểm.`:`Ngày ${d}: chưa đăng.`}</div>`;

  const per=s.per||[],maxRate=Math.max(...per.map(x=>x.like/x.n),.01);
  return `<div class="card"><div class="hook">“${esc(p.text)}”</div>${tagPills(p,s)}</div>
  ${p.closed?'':`<p class="muted">🔴 Đang lên sóng: số liệu tăng dần tới 24:00. Tổng điểm ngày chốt lúc 24:00.</p>`}
  <div class="stats">
    ${statBox(s.likeTA||0,'❤️ Like đúng tệp','main')}${statBox(s.likeOff||0,'❤️ Like ngoài tệp')}${statBox(s.shareTA||0,'🔁 Share đúng tệp','main')}
    ${statBox(s.shareOff||0,'🔁 Share ngoài tệp')}${statBox(pctOf(s)+'%','🎯 Tỷ lệ đúng tệp')}${statBox((s.mult||1)<1?('−'+Math.round((1-s.mult)*100)+'%'):'✓','✅ Guideline')}

  <div class="stats" style="grid-template-columns:repeat(4,1fr)">${statBox(w.memLike||0,'❤️ Thành viên')}${statBox(w.memShare||0,'🔁 Thành viên')}${statBox(w.guestLike||0,'❤️ Khách')}${statBox(w.guestShare||0,'🔁 Khách')}</div>
  <div class="stats" style="grid-template-columns:1fr">${statBox(p.closed?p.total:'⏳','⭐ Tổng điểm ngày '+d+(p.closed?'':' · chốt lúc 24:00'),'top')}</div>
  <h4>Phản ứng theo nhóm khách đi tàu</h4>

  <h4>Nhận xét</h4><ul class="notes">${notesFor(p).map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`;
}
function weekChart(){
  const me=S.me,pts=[];
  for(let d=1;d<=me.days;d++){const p=(me.posts||[]).find(x=>x.day===d);pts.push(p&&p.closed?p.total:(!p&&d<me.today?0:null))}
  const max=Math.max(60,...pts.filter(x=>x!=null));const W=360,H=120,n=Math.max(1,me.days-1),px=d=>20+d*(W-40)/n,py=v=>H-18-(v/max)*(H-36);
  let path='';pts.forEach((v,i)=>{if(v==null)return;path+=(path?'L':'M')+px(i)+' '+py(v)});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="20" x2="${W-20}" y1="${H-18}" y2="${H-18}" stroke="#2a3142"/>
   ${path?`<path d="${path}" fill="none" stroke="#ff8fb1" stroke-width="2.5"/>`:''}
   ${pts.map((v,i)=>v==null?'':`<circle cx="${px(i)}" cy="${py(v)}" r="4" fill="#ff8fb1"/><text x="${px(i)}" y="${py(v)-8}" fill="#eef0f6" font-size="11" text-anchor="middle">${v}</text>`).join('')}
   ${pts.map((_,i)=>`<text x="${px(i)}" y="${H-4}" fill="#8a91a5" font-size="10" text-anchor="middle">N${i+1}</text>`).join('')}</svg>`;
}

  return h;
}

function readGroupForm(k){

let scale=1,ox=0,oy=0,dpr=1;
function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  const r=cv.getBoundingClientRect();
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);
  scale=Math.min(cv.width/W,cv.height/H);ox=(cv.width-W*scale)/2;oy=(cv.height-H*scale)/2;
}

function toLogical(e){const r=cv.getBoundingClientRect();return{x:((e.clientX-r.left)*dpr-ox)/scale,y:((e.clientY-r.top)*dpr-oy)/scale}}
const inR=(p,R)=>p.x>=R.x&&p.x<=R.x+R.w&&p.y>=R.y&&p.y<=R.y+R.h;
cv.addEventListener('pointerdown',e=>{
  const p=toLogical(e);
  if(inR(p,KIOSK)){player.tx=KIOSK.x+KIOSK.w+12;player.ty=KIOSK.y+KIOSK.h-4;openTab('post');return}
  if(inR(p,BOARD)){player.tx=BOARD.x-12;player.ty=BOARD.y+BOARD.h-4;openTab('res');return}

});
$('prompt').onclick=()=>{if(near(KIOSK))openTab('post');else openTab('res')};
function near(R){return Math.hypot(player.x-(R.x+R.w/2),player.y-(R.y+R.h))<52}

function update(dt){
  // tàu
  if(train.st==='away'){train.t-=dt;if(train.t<=0){train.st='in';train.x=700}}
  else if(train.st==='in'){train.x-=Math.max(30,(train.x-130)*1.4)*dt;if(train.x<=131){train.x=130;train.st='stop';train.t=5;onStop()}}
  else if(train.st==='stop'){train.t-=dt;if(train.t<=0){train.st='out';train.v=10}}
  else if(train.st==='out'){train.v+=120*dt;train.x-=train.v*dt;if(train.x<-420){train.st='away';train.t=rnd(5,9)}}
  // npc
  for(const n of npcs){
    n.f+=dt;
    if(n.st==='walk'||n.st==='board'){
      const dx=n.tx-n.x,dy=n.ty-n.y,d=Math.hypot(dx,dy);
      if(d<1.5){
        if(n.st==='board'){if(train.st==='stop'){n.dead=true}else newTarget(n)}
        else{n.st='idle';n.t=rnd(1.5,5)}
      }else{n.x+=dx/d*n.spd*dt;n.y+=dy/d*n.spd*dt;n.dir=dx<0?-1:1}
      if(n.st==='board'&&train.st!=='stop'&&train.st!=='in') newTarget(n);
    }else{n.t-=dt;if(n.t<=0)newTarget(n)}
    if(run){
      n.react-=dt;
      if(n.react<=0){
        n.react=rnd(1.2,3.2);
        const ps=run.per.find(p=>p.id===n.seg);if(!ps)continue;
        const r=Math.random();
        if(r<ps.pShare*2.4){fx.push({x:n.x,y:n.y-20,k:'share',life:1.4});
          const o=npcs[Math.random()*npcs.length|0];if(o&&o!==n)parts.push({x0:n.x,y0:n.y-10,x1:o.x,y1:o.y-10,t:0,c:SEG[n.seg].color})}
        else if(r<ps.pShare*2.4+ps.pLike*1.7) fx.push({x:n.x,y:n.y-20,k:'like',life:1.3});
        else if(Math.random()<.3) fx.push({x:n.x,y:n.y-20,k:'skip',life:1});
      }
    }
  }
  npcs=npcs.filter(n=>!n.dead);
  while(npcs.length<14) spawn(Math.random()<.5?FLOOR.x0+2:FLOOR.x1-2,rnd(110,250));
  // người chơi
  let vx=(keys['arrowright']||keys['d']?1:0)-(keys['arrowleft']||keys['a']?1:0);
  let vy=(keys['arrowdown']||keys['s']?1:0)-(keys['arrowup']||keys['w']?1:0);
  if(vx||vy){player.tx=null;const l=Math.hypot(vx,vy);player.x+=vx/l*60*dt;player.y+=vy/l*60*dt;player.moving=true;if(vx)player.dir=vx}
  else if(player.tx!=null){const dx=player.tx-player.x,dy=player.ty-player.y,d=Math.hypot(dx,dy);
    if(d<2){player.tx=null;player.moving=false}else{player.x+=dx/d*60*dt;player.y+=dy/d*60*dt;player.moving=true;if(Math.abs(dx)>.5)player.dir=dx<0?-1:1}}
  else player.moving=false;
  player.x=Math.max(FLOOR.x0,Math.min(FLOOR.x1,player.x));player.y=Math.max(FLOOR.y0,Math.min(FLOOR.y1,player.y));
  player.f+=dt;
  fx.forEach(f=>{f.y-=14*dt;f.life-=dt});fx=fx.filter(f=>f.life>0);
  parts.forEach(p=>p.t+=dt*1.2);parts=parts.filter(p=>p.t<1);
  const showPrompt=near(KIOSK)||near(BOARD);
  const pr=$('prompt');pr.style.display=showPrompt?'block':'none';
  if(showPrompt) pr.textContent=near(KIOSK)?'📱 Chạm hoặc nhấn E để mở quầy MetroGram':'📊 Chạm hoặc nhấn E để xem bảng kết quả';
}
function onStop(){
  const leave=npcs.filter(n=>n.st!=='board').sort(()=>Math.random()-.5).slice(0,2+(Math.random()*2|0));
  leave.forEach(n=>{n.st='board';n.tx=train.x+DOORS[Math.random()*4|0];n.ty=268});
  const k=2+(Math.random()*2|0);
  for(let i=0;i<k;i++){const n=spawn(train.x+DOORS[Math.random()*4|0],268)}
}

function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function lg(x0,y0,x1,y1,stops){const g=ctx.createLinearGradient(x0,y0,x1,y1);stops.forEach(([o,c])=>g.addColorStop(o,c));return g}
function rg(x,y,r,c){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');return g}
function glowRect(x,y,w,h,r,c,blur){ctx.save();ctx.shadowColor=c;ctx.shadowBlur=blur*scale;rr(x,y,w,h,r);ctx.fillStyle=c;ctx.fill();ctx.restore()}
function wrap(text,maxW){const words=text.split(/\s+/);const lines=[];let cur='';
  for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t}
  if(cur)lines.push(cur);return lines}
function heartPath(x,y,s){ctx.beginPath();ctx.moveTo(x,y+s*.3);
  ctx.bezierCurveTo(x,y,x-s*.5,y,x-s*.5,y+s*.3);ctx.bezierCurveTo(x-s*.5,y+s*.6,x,y+s*.8,x,y+s);
  ctx.bezierCurveTo(x,y+s*.8,x+s*.5,y+s*.6,x+s*.5,y+s*.3);ctx.bezierCurveTo(x+s*.5,y,x,y,x,y+s*.3);ctx.closePath()}
function drawPerson(x,y,shirt,skin,hair,f,moving,phone,dir,isMe){

  // chân
  const sw=moving?Math.sin(f*9)*2.2:0;
  ctx.strokeStyle='#1a1f2b';ctx.lineWidth=2.6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x-1.8,y-7-bob);ctx.lineTo(x-1.8+sw,y-1);ctx.moveTo(x+1.8,y-7-bob);ctx.lineTo(x+1.8-sw,y-1);ctx.stroke();
  // thân
  rr(x-5,y-18-bob,10,12,4.5);ctx.fillStyle=lg(0,y-18-bob,0,y-6-bob,[[0,shirt],[1,shade(shirt,-.28)]]);ctx.fill();
  // túi đeo chéo
  ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x-4*dir,y-17-bob);ctx.lineTo(x+4*dir,y-9-bob);ctx.stroke();
  // đầu
  ctx.fillStyle=skin;ctx.beginPath();ctx.arc(x,y-22-bob,4.2,0,7);ctx.fill();
  ctx.fillStyle=hair;ctx.beginPath();ctx.arc(x,y-23-bob,4.4,Math.PI*1.05,Math.PI*1.95);ctx.fill();
  if(phone){ctx.save();ctx.shadowColor='#8fe9ff';ctx.shadowBlur=4*scale;rr(x+(dir>0?2.5:-5),y-14-bob,2.6,3.8,.8);ctx.fillStyle='#bff4ff';ctx.fill();ctx.restore()}
}
function shade(hex,p){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  const t=p<0?0:255,a=Math.abs(p);r=Math.round(r+(t-r)*a);g=Math.round(g+(t-g)*a);b=Math.round(b+(t-b)*a);return `rgb(${r},${g},${b})`}

      ctx.fillStyle='#0d121b';if(o>0)ctx.fillRect(dx-o,293,o*2,36);
      ctx.strokeStyle='rgba(30,40,60,.35)';ctx.lineWidth=.6;ctx.strokeRect(dx-7-o,293,7,36);ctx.strokeRect(dx+o,293,7,36);
      if(first){ctx.save();ctx.shadowColor='#fff3c4';ctx.shadowBlur=8*scale;ctx.fillStyle='#fff8dc';rr(cx+3,318,5,2.4,1);ctx.fill();ctx.restore();
        rr(cx+16,286,30,5,1.2);ctx.fillStyle='#10131a';ctx.fill();ctx.fillStyle='#ffb347';ctx.font=f_(700,3.6);ctx.fillText('1 · CIRCLE',cx+18,288.7)}
      if(lastC){ctx.fillStyle='#ff4d5e';rr(cx+CW-7,318,4,2.4,1);ctx.fill()}
    }
  }
  // ===== người
  const list=[...npcs.map(n=>({y:n.y,n})),{y:player.y,p:true}].sort((a,b)=>a.y-b.y);
  const ta=myTA();
  for(const it of list){
    if(it.p){
      const r=6+Math.sin(T*3)*1.2;ctx.strokeStyle='rgba(198,191,255,.8)';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(player.x,player.y,r+2,(r+2)*.35,0,0,7);ctx.stroke();
      drawPerson(player.x,player.y,'#c6bfff','#f1c9a5','#2b2230',player.f,player.moving,false,player.dir);
      rr(player.x-9,player.y-38,18,8,4);ctx.fillStyle='#c6bfff';ctx.fill();
      ctx.fillStyle='#13121b';ctx.font=f_(700,5);ctx.textAlign='center';ctx.fillText('Bạn',player.x,player.y-33.8);ctx.textAlign='left';continue}
    const n=it.n;
    if(highlightTA&&ta.includes(n.seg)){ctx.strokeStyle='#ffd27a';ctx.lineWidth=1.1;ctx.beginPath();ctx.ellipse(n.x,n.y,8,2.8,0,0,7);ctx.stroke()}
    drawPerson(n.x,n.y,SEG[n.seg].color,n.skin,n.hair,n.f,n.st!=='idle',n.st==='idle'||!!run,n.dir);
    if(highlightTA&&ta.includes(n.seg)){ctx.fillStyle='#ffd27a';ctx.font=f_(700,6);ctx.textAlign='center';ctx.fillText('★',n.x,n.y-31);ctx.textAlign='left'}
  }
  // share bay
  for(const p of parts){const t=p.t;
    for(let k=0;k<4;k++){const tt=Math.max(0,t-k*.04),x=p.x0+(p.x1-p.x0)*tt,y=p.y0+(p.y1-p.y0)*tt-Math.sin(tt*Math.PI)*22;
      ctx.globalAlpha=(1-t*.6)*(1-k*.22);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(x,y,1.6-k*.25,0,7);ctx.fill()}
    ctx.globalAlpha=1}
  // icon phản ứng
  for(const f of fx){const a=Math.min(1,f.life*1.5);ctx.globalAlpha=a;
    if(f.k==='like'){ctx.save();ctx.shadowColor='#ff5c8a';ctx.shadowBlur=6*scale;ctx.fillStyle='#ff5c8a';heartPath(f.x,f.y-3,7);ctx.fill();ctx.restore()}
    else if(f.k==='share'){ctx.fillStyle='#22c38e';ctx.beginPath();ctx.arc(f.x,f.y,5,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font=f_(700,6.5);ctx.textAlign='center';ctx.fillText('↗',f.x,f.y+.3);ctx.textAlign='left'}
    else{ctx.fillStyle='rgba(200,205,220,.7)';for(let k=-1;k<=1;k++){ctx.beginPath();ctx.arc(f.x+k*2.6,f.y,.9,0,7);ctx.fill()}}
    ctx.globalAlpha=1}
}

// ---------------------------------------------------------------- màn hình lớn, Ad Wall, HUD
const GENERIC=SEGS.map(s=>({id:s.id,pLike:.16,pShare:.025}));
function animSrc(){
  if(isMember()){const p=todayPost();if(p&&!p.closed&&p.progress>0&&p.sim&&p.sim.per)return {per:p.sim.per};return null}
  if(S.feed&&S.feed.ok&&!S.feed.locked&&S.feed.posts&&S.feed.posts.length)return {per:GENERIC};
  return null;
}
function feedRot(now){const f=S.feed&&S.feed.ok&&!S.feed.locked?S.feed.posts:[];if(!f||!f.length)return null;const i=Math.floor(now/8000)%f.length;return {p:f[i],i,n:f.length}}
function drawScreenBody(sx,sy,sw,now){
  const hdr=(t,bright)=>{ctx.textAlign='right';ctx.font=f_(700,6);ctx.fillStyle=bright?'#fff':'rgba(255,255,255,.9)';ctx.fillText(t,sx+sw-8,sy+7.8);ctx.textAlign='left'};
  const center=(a,b)=>{ctx.fillStyle='rgba(243,240,250,.9)';ctx.font=f_(600,8.6);ctx.textAlign='center';ctx.fillText(a,sx+sw/2,sy+40);
    if(b){ctx.fillStyle='rgba(229,224,237,.55)';ctx.font=f_(400,6.4);ctx.fillText(b,sx+sw/2,sy+53)}ctx.textAlign='left'};
  const card=(brand,sub,text,lk,shc)=>{
    ctx.fillStyle=lg(sx+8,0,sx+20,0,[[0,'#ff8fb1'],[1,'#b388ff']]);ctx.beginPath();ctx.arc(sx+15,sy+25,6.5,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.font=f_(700,7);ctx.textAlign='center';ctx.fillText((brand||'?')[0],sx+15,sy+25.3);ctx.textAlign='left';
    ctx.font=f_(700,7);ctx.fillText(brand,sx+26,sy+22.5);
    ctx.fillStyle='rgba(229,224,237,.55)';ctx.font=f_(400,5.6);ctx.fillText(sub,sx+26,sy+29.5);
    ctx.fillStyle='#f3f0fa';ctx.font=f_(600,8.4);wrap(text,sw-20).slice(0,3).forEach((l,i)=>ctx.fillText(l,sx+10,sy+42+i*10.5));
    if(lk!=null){ctx.fillStyle='#ff5c8a';heartPath(sx+sw-62,sy+24,6);ctx.fill();ctx.fillStyle='#fff';ctx.font=f_(700,6.6);ctx.fillText(lk,sx+sw-55,sy+27.3);
      ctx.fillStyle='#5ee0a0';ctx.fillText('↗',sx+sw-32,sy+27.3);ctx.fillStyle='#fff';ctx.fillText(shc,sx+sw-25,sy+27.3)}
  };
  if(isMember()){
    const me=S.me,p=todayPost(),b=me.group.brand||{};
    if(me.today<1){hdr('CHƯA MỞ');center('MetroGram chưa mở cho lớp '+me.group.class_code,'Chờ giảng viên bắt đầu tuần nhé');return}
    if(me.today>me.days){hdr('ĐÃ HẾT TUẦN');center('Cảm ơn các agency!','Xem Kết quả và Xếp hạng ở bảng bên phải');return}
    if(!p){hdr(`NGÀY ${me.today}/${me.days}`);center('Chưa có hook hôm nay','Ghé quầy MetroGram bên trái để đăng nhé');return}
    const live=!p.closed&&p.progress>0;
    if(live)hdr('● LIVE',Math.sin(now/300)>0);else hdr(p.closed?'ĐÃ CHỐT':'LÊN SÓNG LÚC '+TIME[p.slot].label.slice(0,5));
    const s=p.sim||{},w=p.web||{};
    const lk=(s.likeTA||0)+(s.likeOff||0)+(w.memLike||0)+(w.guestLike||0),sh=(s.shareTA||0)+(s.shareOff||0)+(w.memShare||0)+(w.guestShare||0);
    card(b.brand||me.group.name,`${me.group.name} · ${TIME[p.slot].label.slice(0,5)}`,p.text,p.progress>0?lk:null,sh);
    return;
  }
  const r=feedRot(now);
  if(!r){hdr('BẢNG TIN');center('Chưa có hook nào lên sóng','Các nhóm lên sóng lúc 07:00 · 12:00 · 20:00 · 23:00');return}
  hdr(`BẢNG TIN · ${r.i+1}/${r.n}`);
  card(r.p.brand,`${r.p.group} · lớp ${r.p.class_code}`,r.p.text,r.p.likes,r.p.shares);
}
function drawAdText(bx,hue){
  const list=S.featured||[];
  ctx.textAlign='center';
  if(!list.length){ctx.fillStyle='rgba(255,255,255,.92)';ctx.font=f_(700,7);ctx.fillText('YOUR HOOK HERE',bx+51,55);
    ctx.font=f_(400,5.6);ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillText('hook hay nhất do giảng viên chọn',bx+51,64);ctx.textAlign='left';return}
  const i=(Math.floor(performance.now()/9000)+hue)%list.length,it=list[i];
  ctx.fillStyle='rgba(255,210,122,.95)';ctx.font=f_(700,5);ctx.fillText('★ '+(it.brand||'')+' · '+(it.group||''),bx+51,44);
  ctx.fillStyle='#fff';ctx.font=f_(600,6);const ls=wrap('“'+it.text+'”',92).slice(0,4);
  ls.forEach((l,k)=>ctx.fillText(l,bx+51,52+k*7.2-(ls.length-3)*3));ctx.textAlign='left';
}
function hud(){
  const h=$('hud'),{h:hh,m}=vnParts(),clock=String(hh).padStart(2,'0')+':'+String(m).padStart(2,'0');
  if(isMember()){
    const me=S.me,p=todayPost();
    if(p&&p.progress>0){const s=p.sim||{};
      h.innerHTML=`<div class="clock">${clock} · Ngày ${me.today}</div>
       <div class="row"><span>❤️ đúng tệp</span><b style="color:var(--pink)">${s.likeTA||0}</b></div>
       <div class="row"><span>❤️ ngoài tệp</span><b>${s.likeOff||0}</b></div>
       <div class="row"><span>🔁 share đúng tệp</span><b style="color:var(--green)">${s.shareTA||0}</b></div>
       <div class="prog"><i style="width:${Math.round((p.progress||0)*100)}%"></i></div>`;return}
    h.innerHTML=`<div class="clock">${clock} · ${me.today<1?'Chưa mở':me.today>me.days?'Hết tuần':'Ngày '+me.today+'/'+me.days}</div><div class="row"><span>${p?'⏰ Lên sóng lúc '+TIME[p.slot].label.slice(0,5):me.today>=1&&me.today<=me.days?'Chưa đăng hook hôm nay':''}</span></div>`;return}
  const n=S.feed&&S.feed.ok&&!S.feed.locked?S.feed.posts.length:0;
  h.innerHTML=`<div class="clock">${clock}</div><div class="row"><span>${n?`📱 ${n} hook đang lên sóng`:'Chưa có hook lên sóng'}</span></div>`;
}

// ---------------------------------------------------------------- khởi động
let last=performance.now(),hudT=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;run=animSrc();update(dt);draw(now);hudT-=dt;if(hudT<=0){hud();hudT=.5}requestAnimationFrame(loop)}
resize();render();requestAnimationFrame(loop);
(async()=>{
  API=await waitApi();S.loading=false;
  if(!API){render();return}
  S.admin=!!API.isAdmin();S.visitor=API.visitor();S.login=lsGet();
  tab=S.login?'brief':'feed';
  await refresh(true);
  if(S.login&&!isMember())tab='feed';
  render();
  setInterval(()=>refresh(false),60000);
  setInterval(()=>{loadFeatured()},300000);
  setInterval(()=>{const a=!!API.isAdmin();if(a!==S.admin){S.admin=a;render()}},2000);
})();
})();
</script>
